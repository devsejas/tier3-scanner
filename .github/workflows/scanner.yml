name: Tier3 Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tier3-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr un escaneo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --once

      - name: Guardar estado y caché de exchanges
        if: always()
        run: |
          git config user.name "tier3-scanner-bot"
          git config user.email "actions@users.noreply.github.com"

          for f in scanner_state.json exchange_cache.json runtime_settings.json telegram_offset.json; do
            [ -f "$f" ] && git add "$f"
          done
          
          if git diff --cached --quiet; then
            echo "No hay cambios en el estado, saltando commit/push"
            exit 0
          fi

          git commit -m "Actualizar estado del scanner [skip ci]"

          for i in 1 2 3; do
            if git pull --rebase origin main 2>&1 && git push origin main 2>&1; then
              echo "✓ Push exitoso en intento $i"
              exit 0
            fi
            echo "⚠ Intento $i falló, reintentando..."
            sleep $((RANDOM % 10 + 3))
          done

          echo "⚠ Advertencia: No se pudo hacer push después de 3 intentos"
          exit 0
