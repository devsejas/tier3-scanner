name: Tier3 Scanner

on:
  schedule:
    # Cada 5 minutos — el mínimo que permite GitHub Actions. Puede haber
    # algunos minutos de retraso en horas de alta demanda de GitHub.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña "Actions"

permissions:
  contents: write   # necesario para poder guardar el estado/caché de vuelta al repo

# Evita que dos ejecuciones corran al mismo tiempo (ej: un "Run workflow" manual
# cruzándose con el cron automático). Las que se crucen esperan en cola en vez
# de correr en paralelo y pelear por el mismo push.
concurrency:
  group: tier3-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # margen extra para la primera corrida (caché de exchange aún "fría")
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr un escaneo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --once

      - name: Guardar estado y caché de exchanges (evita alertas repetidas y acelera corridas futuras)
        run: |
          git config user.name "tier3-scanner-bot"
          git config user.email "actions@users.noreply.github.com"

          for f in scanner_state.json exchange_cache.json runtime_settings.json telegram_offset.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0

          git commit -m "Actualizar estado del scanner [skip ci]"

          # Por si acaso el remoto cambió justo antes de este push (aunque el
          # concurrency group de arriba ya debería evitar esto casi siempre)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push rechazado, reintentando ($i)..."
            sleep $((RANDOM % 10 + 3))
          done
